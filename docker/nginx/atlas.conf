# Sample nginx reverse proxy for Infrastructure Atlas: terminates TLS and forwards to the app.
# docker/compose.nginx.yml mounts it as /etc/nginx/conf.d/default.conf (inside nginx's http {}).
# On a host install instead: drop the `resolver` line, change `app:3000` to `127.0.0.1:3000`
# and point the certificate paths at your files. Set `server_name` to your domain in both servers.

# Per-client limit for login and password endpoints. Account lockout alone is per account.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# Docker's internal DNS. `resolve` re-looks up `app` when its container is recreated with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream atlas_app {
    zone atlas_app 64k;
    server app:3000 resolve;
    keepalive 16;
}

server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Put fullchain.pem and privkey.pem in docker/nginx/certs/ (gitignored).
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;

    # Payload accepts uploads up to 10 MB (src/payload.config.ts), plus multipart overhead.
    client_max_body_size 12m;

    # The app already sends HSTS, CSP and the other security headers; adding them here would
    # duplicate them.

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location / {
        proxy_pass http://atlas_app;
    }

    location ~ ^/api/users/(login|forgot-password|reset-password|unlock)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://atlas_app;
    }
}
