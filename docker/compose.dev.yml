# Local development database only. The app itself runs on the host with `pnpm dev`.
# Start it with `pnpm db:up`. The fixed project name keeps the existing data volume.
name: infrastructure-atlas

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # Fixed local-only credentials matching .env.example. Not read from docker/.env, which belongs
    # to the production-style stack in docker/compose.yml.
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: infrastructure_atlas
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
