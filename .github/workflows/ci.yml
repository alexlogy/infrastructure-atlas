name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: infrastructure_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d infrastructure_atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only placeholders. No production credentials or real content are used.
    env:
      DATABASE_URI: postgresql://ci_user:ci-password@localhost:5432/infrastructure_atlas_test
      TEST_DATABASE_URI: postgresql://ci_user:ci-password@localhost:5432/infrastructure_atlas_test
      PAYLOAD_SECRET: ci-placeholder-secret-for-build-and-tests-only
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: infrastructure_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d infrastructure_atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URI: postgresql://ci_user:ci-password@localhost:5432/infrastructure_atlas_test
      DATABASE_URI: postgresql://ci_user:ci-password@localhost:5432/infrastructure_atlas_test
      PAYLOAD_SECRET: ci-placeholder-secret-for-build-and-tests-only
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Fails on high/critical advisories; moderate/low are reported but tracked manually.
      - run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
