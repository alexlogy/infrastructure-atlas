name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: infrastructure_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d infrastructure_atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only placeholders. No production credentials or real content are used.
    env:
      DATABASE_URI: postgresql://ci_user:ci-password@localhost:5432/infrastructure_atlas_test
      TEST_DATABASE_URI: postgresql://ci_user:ci-password@localhost:5432/infrastructure_atlas_test
      PAYLOAD_SECRET: ci-placeholder-secret-for-build-and-tests-only
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: infrastructure_atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d infrastructure_atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URI: postgresql://ci_user:ci-password@localhost:5432/infrastructure_atlas_test
      DATABASE_URI: postgresql://ci_user:ci-password@localhost:5432/infrastructure_atlas_test
      PAYLOAD_SECRET: ci-placeholder-secret-for-build-and-tests-only
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Fails on high/critical advisories; moderate/low are reported but tracked manually.
      - run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI-only placeholders for docker/compose.yml. No production credentials are used.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PAYLOAD_SECRET: ci-placeholder-secret-for-the-docker-smoke-test
      POSTGRES_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack (database, migrations, app)
        run: docker compose -f docker/compose.yml up -d --build
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 2; done
          test "$(docker compose -f docker/compose.yml ps -a migrate --format '{{.ExitCode}}')" = 0
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/admin
          test "$(docker compose -f docker/compose.yml exec -T app id -u)" != 0
      - name: Smoke test through the sample nginx proxy (self-signed certificate)
        run: |
          mkdir -p docker/nginx/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout docker/nginx/certs/privkey.pem -out docker/nginx/certs/fullchain.pem
          docker compose -f docker/compose.yml -f docker/compose.nginx.yml up -d --wait nginx
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 301
          curl -kfsS https://localhost/api/health
          curl -kfsS -o /dev/null https://localhost/
          # The app port is no longer published; only nginx is reachable.
          if curl -fsS --max-time 3 http://localhost:3000/api/health; then exit 1; fi
          # Login attempts beyond the burst are rate-limited.
          for i in $(seq 1 9); do
            curl -ks -o /dev/null -w '%{http_code}\n' -X POST https://localhost/api/users/login
          done | grep 429
      # Trivy run from its image, pinned by digest (0.76.2), rather than a mutable action tag.
      - name: Scan the app image (fixable high/critical vulnerabilities fail the job)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln
          infrastructure-atlas-prod-app
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml -f docker/compose.nginx.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f docker/compose.yml -f docker/compose.nginx.yml down -v
